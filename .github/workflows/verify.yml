name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 26.11.1
      - run: bun install --frozen-lockfile
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      # Allow namespaces only for downloaded headless Chromium in this runner's cache.
      # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
      - name: Configure sandboxed Chromium on Ubuntu
        if: runner.os == 'Linux'
        run: |
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile crewplane-chromium "%s/.cache/ms-playwright/**/chrome-headless-shell" flags=(unconfined) {\n  userns,\n}\n' "$HOME" > /tmp/crewplane-chromium.apparmor
          sudo install -m 0644 /tmp/crewplane-chromium.apparmor /etc/apparmor.d/crewplane-chromium
          sudo apparmor_parser -r /etc/apparmor.d/crewplane-chromium
      - run: bun run verify
        env:
          TMPDIR: /tmp
      - run: shasum -a 256 dist/crewplane > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: crewplane-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/crewplane
            dist/SHA256SUMS
