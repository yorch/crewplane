name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.11.1
      - run: bun install --frozen-lockfile
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      # Allow namespaces only for downloaded headless Chromium in this runner's cache.
      # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
      - name: Configure sandboxed Chromium on Ubuntu
        if: runner.os == 'Linux'
        run: |
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile crewplane-chromium "%s/.cache/ms-playwright/**/chrome-headless-shell" flags=(unconfined) {\n  userns,\n}\n' "$HOME" > /tmp/crewplane-chromium.apparmor
          sudo install -m 0644 /tmp/crewplane-chromium.apparmor /etc/apparmor.d/crewplane-chromium
          sudo apparmor_parser -r /etc/apparmor.d/crewplane-chromium
      - run: bun run verify
        env:
          TMPDIR: /tmp
      - name: install.sh keys equal release-keys.json
        run: bun scripts/sync-install-keys.ts --check
      - name: Embedded dashboard assets are up to date
        # embed.ts rebuilds src/engine/assets from scratch and rewrites assets.ts
        # from a scan of src/engine/dashboard, then `git status --porcelain`
        # (which lists modified, deleted and untracked paths alike) must be
        # empty for the generated paths. That catches: a new source whose copy
        # was never committed (untracked), a missing copy (untracked), a stale or
        # hand-edited copy (modified), and an orphan copy with no source any
        # more (deleted by the rebuild).
        run: |
          bun scripts/embed.ts
          status="$(git status --porcelain --untracked-files=all -- src/engine/assets src/engine/assets.ts src/engine/dashboard/index.html)"
          if [ -n "$status" ]; then
            echo "Generated dashboard assets are out of date; run 'bun scripts/embed.ts' and commit:" >&2
            echo "$status" >&2
            exit 1
          fi
      - run: shasum -a 256 dist/crewplane > dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crewplane-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/crewplane
            dist/SHA256SUMS
