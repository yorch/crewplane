name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 26.11.1
      - run: bun install --frozen-lockfile
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: bun run verify
        env:
          TMPDIR: /tmp
      - run: shasum -a 256 dist/crewplane > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: crewplane-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/crewplane
            dist/SHA256SUMS
