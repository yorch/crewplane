name: Release
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  verify:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.11.1
      - run: bun install --frozen-lockfile
      - name: Tag must match package.json
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: test "v$(bun -p 'require("./package.json").version')" = "$TAG"
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Configure sandboxed Chromium on Ubuntu
        if: runner.os == 'Linux'
        run: |
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile crewplane-chromium "%s/.cache/ms-playwright/**/chrome-headless-shell" flags=(unconfined) {\n  userns,\n}\n' "$HOME" > /tmp/crewplane-chromium.apparmor
          sudo install -m 0644 /tmp/crewplane-chromium.apparmor /etc/apparmor.d/crewplane-chromium
          sudo apparmor_parser -r /etc/apparmor.d/crewplane-chromium
      - run: bun run verify
        env:
          TMPDIR: /tmp
  # The signed binaries come from a clean checkout that never runs tests, the
  # browser install or any verification tooling: only dependencies installed
  # without lifecycle scripts, then the release build.
  build:
    needs: [release-please, verify]
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, name: linux }
          - { os: macos-latest, name: macos }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Tag must match package.json
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: test "v$(bun -p 'require("./package.json").version')" = "$TAG"
      - name: Package
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          # Only this build self-updates: the marker is inlined at compile time.
          bun run build:release
          arch="$(uname -m)"
          asset="crewplane-${TAG}-${{ matrix.name }}-${arch}"
          mkdir -p release
          cp dist/crewplane "release/${asset}"
          (cd release && shasum -a 256 "${asset}" > "${asset}.sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.name }}
          path: release/*
  publish:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: install.sh keys must equal release-keys.json
        run: bun scripts/sync-install-keys.ts --check
      # With keys listed in release-keys.json the secret is mandatory: this step
      # fails (no unsigned release) when it is missing or does not match a
      # listed key. With no keys it prints a notice and signs nothing.
      - name: Sign release assets
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          assets=$(find release -maxdepth 1 -type f -name 'crewplane-*' ! -name '*.sha256' ! -name '*.sig')
          # shellcheck disable=SC2086
          bun scripts/sign-release.ts --tag "$TAG" $assets
      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        # No --clobber: published assets are immutable (see docs/RELEASING.md).
        run: gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY"
